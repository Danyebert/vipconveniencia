{% extends 'base.html' %}{% block page_title %}Categorias{% endblock %}{% block content %}<div class="row g-4"><div class="col-lg-4"><div class="panel"><h3>Nova categoria</h3><form method="post"><label>Nome</label><input name="nome" class="form-control mb-3" required><button class="btn btn-primary w-100">Cadastrar</button></form></div></div><div class="col-lg-8"><div class="panel"><h3>Categorias cadastradas</h3><table class="table"><thead><tr><th>Nome</th><th>Status</th><th></th></tr></thead><tbody>{% for c in categories %}<tr><td>{{ c.nome }}</td><td><span class="badge text-bg-{{ 'success' if c.ativo else 'secondary' }}">{{ 'Ativa' if c.ativo else 'Inativa' }}</span></td><td class="text-end"><form method="post" action="{{ url_for('category_toggle', item_id=c.id) }}"><button class="btn btn-sm btn-outline-secondary">{{ 'Desativar' if c.ativo else 'Ativar' }}</button></form></td></tr>{% endfor %}</tbody></table></div></div></div>{% endblock %}
