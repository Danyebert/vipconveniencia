{% extends 'base.html' %}{% block page_title %}{{ 'Editar' if product else 'Novo' }} produto{% endblock %}{% block content %}<div class="panel form-panel"><form method="post"><div class="row g-3"><div class="col-md-8"><label>Nome</label><input class="form-control" name="nome" value="{{ product.nome if product else '' }}" required></div><div class="col-md-4"><label>Categoria</label><select class="form-select" name="categoria_id" required>{% for c in categories %}<option value="{{ c.id }}" {% if product and product.categoria_id == c.id %}selected{% endif %}>{{ c.nome }}</option>{% endfor %}</select></div><div class="col-12"><label>Descrição</label><textarea class="form-control" name="descricao">{{ product.descricao if product else '' }}</textarea></div><div class="col-md-3"><label>Preço de compra</label><input class="form-control calc" id="purchase" name="preco_compra" value="{{ product.preco_compra if product else '0,00' }}" required></div><div class="col-md-3"><label>Margem (%)</label><input class="form-control calc" id="margin" name="margem" value="{{ product.margem if product else '30' }}" required></div><div class="col-md-3"><label>Preço sugerido</label><input class="form-control" id="suggested" readonly value="{{ product.preco_sugerido if product else '' }}"></div><div class="col-md-3"><label>Preço de venda</label><input class="form-control" name="preco_venda" value="{{ product.preco_venda if product else '' }}" required></div><div class="col-md-3"><label>Estoque mínimo</label><input class="form-control" name="estoque_minimo" value="{{ product.estoque_minimo if product else '5' }}"></div><div class="col-md-9"><label>URL da imagem</label><input class="form-control" name="imagem_url" placeholder="https://..." value="{{ product.imagem_url if product and product.imagem_url else '' }}"></div><div class="col-12"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" name="ativo" id="ativo" {% if not product or product.ativo %}checked{% endif %}><label class="form-check-label" for="ativo">Produto ativo no catálogo</label></div></div></div><div class="form-actions"><a class="btn btn-light" href="{{ url_for('products') }}">Cancelar</a><button class="btn btn-primary">Salvar produto</button></div></form></div>{% endblock %}{% block scripts %}<script>function n(v){return parseFloat(String(v).replace(',','.'))||0} function calc(){document.getElementById('suggested').value=(n(purchase.value)*(1+n(margin.value)/100)).toFixed(2).replace('.',',')} document.querySelectorAll('.calc').forEach(x=>x.addEventListener('input',calc));calc();</script>{% endblock %}
